# RabbitMQ como broker STOMP del Real-Time Gateway (HU-DT-01, ADR-04).
# El relay de Spring abre una conexión TCP por sesión de navegador: el límite por defecto de
# conexiones es amplio, pero los latidos STOMP los negocia cada cliente (10 s en el frontend).
listeners.tcp.default = 5672
stomp.listeners.tcp.1 = 61613
# Sin usuario "guest": las credenciales llegan por RABBITMQ_DEFAULT_USER/PASS.
loopback_users = none
stomp.implicit_connect = false
# Prometheus (R2-30/R2-33) en 15692, solo en la red interna.
prometheus.tcp.port = 15692

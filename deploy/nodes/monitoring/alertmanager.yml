# OBS-1 / SEG-4 · Alertmanager del despliegue. Canal real: Discord. La URL del webhook es un SECRETO: vive en
# el archivo secrets/discord_webhook de la VM de monitoreo (no se versiona; ver .gitignore) y se lee desde allí.
#   printf '%s' 'https://discord.com/api/webhooks/<id>/<token>' > secrets/discord_webhook && docker compose restart alertmanager
route:
  receiver: equipo
  group_by: [alertname, job]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 2h
  routes:
    - matchers: [scenario="SEG-4"]
      receiver: equipo
      group_wait: 0s
receivers:
  - name: equipo
    discord_configs:
      - webhook_url_file: /etc/alertmanager/secrets/discord_webhook
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        message: |-
          {{ range .Alerts }}**{{ .Annotations.summary }}**
          {{ .Annotations.description }}
          escenario: {{ .Labels.scenario }} · severidad: {{ .Labels.severity }}
          {{ end }}

# Nodo de SERVICIOS (services-1 y services-2 usan este mismo archivo, cada uno con su .env).
# Una réplica de cada microservicio por nodo; el balanceo entre nodos lo hace NGINX en el borde.
# Despliegue: el pipeline (R2-6) ejecuta deploy/scripts/deploy-service.sh en un nodo y luego en el otro.
name: zeal

x-service: &service
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-common-env: &common-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
  REDIS_HOST: ${DATA_NODE_IP:?}
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  JWT_SECRET: ${JWT_SECRET:?}
  JWT_ISSUER: zeal
  APP_TIME_ZONE: America/Bogota
  CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?}
  DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
  NODE_NAME: ${NODE_NAME:?}

services:
  wellbeing:
    <<: *service
    image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-wellbeing-service:${WELLBEING_TAG:-latest}
    mem_limit: ${WELLBEING_MEM:-1g}
    ports: ["${PRIVATE_IP:?}:8081:8081"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://${DATA_NODE_IP}:5432/zeal_wellbeing_db
      DB_USERNAME: ${WELLBEING_DB_APP_USER:-zeal_app}
      DB_PASSWORD: ${WELLBEING_DB_APP_PASSWORD:?}
      SPRING_FLYWAY_USER: ${WELLBEING_DB_OWNER_USER:-zeal_owner}
      SPRING_FLYWAY_PASSWORD: ${WELLBEING_DB_OWNER_PASSWORD:?}
      ROOM_ICE_SERVERS: stun:stun.l.google.com:19302
      TURN_URLS: ${TURN_URLS:?}
      TURN_SECRET: ${TURN_SECRET:?}
      LIVEKIT_PUBLIC_URL: /livekit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      OIDC_REDIRECT_URI: ${PUBLIC_URL}/api/auth/microsoft/callback
      FRONTEND_URL: ${PUBLIC_URL}

  marketplace:
    <<: *service
    image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-marketplace-service:${MARKETPLACE_TAG:-latest}
    mem_limit: ${MARKETPLACE_MEM:-1g}
    ports: ["${PRIVATE_IP:?}:8082:8082"]
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://${DATA_NODE_IP}:5433/zeal_marketplace_db
      DB_USERNAME: ${MARKETPLACE_DB_APP_USER:-zeal_app}
      DB_PASSWORD: ${MARKETPLACE_DB_APP_PASSWORD:?}
      SPRING_FLYWAY_USER: ${MARKETPLACE_DB_OWNER_USER:-zeal_owner}
      SPRING_FLYWAY_PASSWORD: ${MARKETPLACE_DB_OWNER_PASSWORD:?}
      LIVEKIT_PUBLIC_URL: /livekit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}

  realtime:
    <<: *service
    image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-realtime-gateway:${REALTIME_TAG:-latest}
    mem_limit: ${REALTIME_MEM:-768m}
    ports: ["${PRIVATE_IP:?}:8083:8083"]
    environment:
      <<: *common-env
      WELLBEING_BASE_URL: http://${PRIVATE_IP}:8081   # Su propio nodo; NGINX no interviene
      RABBITMQ_HOST: ${DATA_NODE_IP}
      RABBITMQ_STOMP_PORT: "61613"
      RABBITMQ_CLIENT_LOGIN: ${RABBITMQ_USER:-zeal}
      RABBITMQ_CLIENT_PASSCODE: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_SYSTEM_LOGIN: ${RABBITMQ_USER:-zeal}
      RABBITMQ_SYSTEM_PASSCODE: ${RABBITMQ_PASSWORD:?}

  # R2-31: consumidor de eventos de dominio → métricas de negocio (deduplica por eventId entre nodos).
  business-metrics:
    <<: *service
    image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-business-metrics:${BUSINESS_METRICS_TAG:-latest}
    mem_limit: 384m
    ports: ["${PRIVATE_IP:?}:8084:8084"]
    environment:
      REDIS_HOST: ${DATA_NODE_IP}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

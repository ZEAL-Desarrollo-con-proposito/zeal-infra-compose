# VM de MARKETPLACE (principal o respaldo). El MISMO archivo se usa en las dos VMs de este microservicio
# (<marketplace>-1 y <marketplace>-2), cada una con su .env; el balanceador del borde reparte entre ambas y, si una VM se
# apaga o se cae, todo el tráfico pasa a la otra sin intervención. Una réplica por VM.
# Despliegue: deploy/scripts/deploy-service.sh actualiza una VM, espera su readiness y recién entonces la otra.
name: zeal-marketplace

x-service: &service
  image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-marketplace-service:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: ${REPLICA_MEM:-1g}
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  environment:
    REDIS_HOST: ${DATA_NODE_IP:?}
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    JWT_SECRET: ${JWT_SECRET:?}
    JWT_ISSUER: zeal
    APP_TIME_ZONE: America/Bogota
    CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?}
    NODE_NAME: ${NODE_NAME:?Define NODE_NAME (p. ej. marketplace-1 o marketplace-2)}
    DB_URL: jdbc:postgresql://${DATA_NODE_IP}:5433/zeal_marketplace_db
    DB_USERNAME: ${DB_APP_USER:-zeal_app}
    DB_PASSWORD: ${DB_APP_PASSWORD:?}
    SPRING_FLYWAY_USER: ${DB_OWNER_USER:-zeal_owner}
    SPRING_FLYWAY_PASSWORD: ${DB_OWNER_PASSWORD:?}
    DB_POOL_SIZE: ${DB_POOL_SIZE:-10}   # ver docs/evidencias/REND.md
    DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
    LIVEKIT_PUBLIC_URL: /livekit
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}

services:
  marketplace:
    <<: *service
    ports: ["${PRIVATE_IP:?}:8082:8082"]

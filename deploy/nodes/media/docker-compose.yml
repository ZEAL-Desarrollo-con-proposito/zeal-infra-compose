# Nodo de MEDIOS (HU-DT-02): LiveKit (SFU de talleres y citas 1:1) y coturn (relé TURN permanente).
# Tiene IP pública: los navegadores envían el audio/video directo aquí. network_mode host: el relé y el
# rango RTC necesitan sus puertos reales. La señalización de LiveKit (7880) entra solo desde el borde.
name: zeal-media

services:
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses: ["${PRIVATE_IP:?}"]
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
          turn_servers:
            - host: ${TURN_DOMAIN:?}
              port: 3478
              protocol: udp
              secret: "${TURN_SECRET:?}"
              ttl: 7200
            - host: ${TURN_DOMAIN}
              port: ${TURN_TLS_PORT:-443}
              protocol: tls
              secret: "${TURN_SECRET}"
              ttl: 7200
        room:
          empty_timeout: 300
          max_participants: 250

  coturn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    network_mode: host
    cap_add: [NET_BIND_SERVICE]   # TLS en un puerto < 1024 (443) con el usuario sin privilegios de la imagen
    volumes:
      - ${TURN_CERT_DIR:?}:/etc/coturn/certs:ro
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --realm=zeal
      - --listening-port=3478
      - --tls-listening-port=${TURN_TLS_PORT:-443}
      - --cert=/etc/coturn/certs/turn.crt
      - --pkey=/etc/coturn/certs/turn.key
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP:?}/${PRIVATE_IP}
      - --no-cli
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      # Excepción: el propio LiveKit de este nodo (el relé entrega medios al SFU).
      - --allowed-peer-ip=${PRIVATE_IP}
      - --prometheus
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 127.0.0.1 > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

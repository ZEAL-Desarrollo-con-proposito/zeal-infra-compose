# VM de WELLBEING (principal o respaldo). El MISMO archivo se usa en las dos VMs de este microservicio
# (<wellbeing>-1 y <wellbeing>-2), cada una con su .env; el balanceador del borde reparte entre ambas y, si una VM se
# apaga o se cae, todo el tráfico pasa a la otra sin intervención. Una réplica por VM.
# Despliegue: deploy/scripts/deploy-service.sh actualiza una VM, espera su readiness y recién entonces la otra.
name: zeal-wellbeing

x-service: &service
  image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-wellbeing-service:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: ${REPLICA_MEM:-1g}
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  environment:
    REDIS_HOST: ${DATA_NODE_IP:?}
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    JWT_SECRET: ${JWT_SECRET:?}
    JWT_ISSUER: zeal
    APP_TIME_ZONE: America/Bogota
    CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?}
    NODE_NAME: ${NODE_NAME:?Define NODE_NAME (p. ej. wellbeing-1 o wellbeing-2)}
    DB_URL: jdbc:postgresql://${DATA_NODE_IP}:5432/zeal_wellbeing_db
    # R2-14: la app usa el rol limitado; Flyway corre con el propietario.
    DB_USERNAME: ${DB_APP_USER:-zeal_app}
    DB_PASSWORD: ${DB_APP_PASSWORD:?}
    SPRING_FLYWAY_USER: ${DB_OWNER_USER:-zeal_owner}
    SPRING_FLYWAY_PASSWORD: ${DB_OWNER_PASSWORD:?}
    DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-false}
    ROOM_ICE_SERVERS: stun:stun.l.google.com:19302
    TURN_URLS: ${TURN_URLS:?}
    TURN_SECRET: ${TURN_SECRET:?}
    LIVEKIT_PUBLIC_URL: /livekit
    LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
    LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
    OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
    OIDC_REDIRECT_URI: ${PUBLIC_URL}/api/auth/microsoft/callback
    FRONTEND_URL: ${PUBLIC_URL}

services:
  wellbeing:
    <<: *service
    ports: ["${PRIVATE_IP:?}:8081:8081"]

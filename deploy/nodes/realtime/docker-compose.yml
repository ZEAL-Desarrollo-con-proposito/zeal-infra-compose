# VM de REALTIME — una máquina virtual dedicada a este microservicio, con DOS réplicas
# (realtime-a en 8083 y realtime-b en 8093). El NGINX del borde reparte entre ambas y, si se agrega otra VM
# de realtime (otro registro A en zeal.internal), también entre máquinas.
# Despliegue: deploy/scripts/deploy-service.sh actualiza una réplica, espera su readiness y luego la otra.
name: zeal-realtime

x-replica: &replica
  image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-realtime-gateway:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: ${REPLICA_MEM:-1g}
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  environment: &env
    REDIS_HOST: ${DATA_NODE_IP:?}
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    JWT_SECRET: ${JWT_SECRET:?}
    JWT_ISSUER: zeal
    APP_TIME_ZONE: America/Bogota
    CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?}
    # Autoriza salas y chats preguntando a wellbeing A TRAVÉS del balanceador del borde (IP privada):
    # así reparte entre las réplicas de wellbeing y tolera la caída de una.
    WELLBEING_BASE_URL: http://${EDGE_NODE_IP:?}:8080
    RABBITMQ_HOST: ${DATA_NODE_IP}
    RABBITMQ_STOMP_PORT: "61613"
    RABBITMQ_CLIENT_LOGIN: ${RABBITMQ_USER:-zeal}
    RABBITMQ_CLIENT_PASSCODE: ${RABBITMQ_PASSWORD:?}
    RABBITMQ_SYSTEM_LOGIN: ${RABBITMQ_USER:-zeal}
    RABBITMQ_SYSTEM_PASSCODE: ${RABBITMQ_PASSWORD:?}

services:
  realtime-a:
    <<: *replica
    ports: ["${PRIVATE_IP:?}:8083:8083"]

  realtime-b:
    <<: *replica
    ports: ["${PRIVATE_IP:?}:8093:8083"]

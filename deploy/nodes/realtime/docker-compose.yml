# VM de REALTIME (principal o respaldo). El MISMO archivo se usa en las dos VMs de este microservicio
# (<realtime>-1 y <realtime>-2), cada una con su .env; el balanceador del borde reparte entre ambas y, si una VM se
# apaga o se cae, todo el tráfico pasa a la otra sin intervención. Una réplica por VM.
# Despliegue: deploy/scripts/deploy-service.sh actualiza una VM, espera su readiness y recién entonces la otra.
name: zeal-realtime

x-service: &service
  image: ${REGISTRY:-ghcr.io}/${GHCR_OWNER:?}/zeal-realtime-gateway:${IMAGE_TAG:-latest}
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: ${REPLICA_MEM:-1g}
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  environment:
    REDIS_HOST: ${DATA_NODE_IP:?}
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    JWT_SECRET: ${JWT_SECRET:?}
    JWT_ISSUER: zeal
    APP_TIME_ZONE: America/Bogota
    CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?}
    NODE_NAME: ${NODE_NAME:?Define NODE_NAME (p. ej. realtime-1 o realtime-2)}
    # Autoriza salas y chats preguntando a wellbeing A TRAVÉS del balanceador del borde (IP privada):
    # así reparte entre las réplicas de wellbeing y tolera la caída de una.
    WELLBEING_BASE_URL: http://${EDGE_NODE_IP:?}:8080
    RABBITMQ_HOST: ${DATA_NODE_IP}
    RABBITMQ_STOMP_PORT: "61613"
    RABBITMQ_CLIENT_LOGIN: ${RABBITMQ_USER:-zeal}
    RABBITMQ_CLIENT_PASSCODE: ${RABBITMQ_PASSWORD:?}
    RABBITMQ_SYSTEM_LOGIN: ${RABBITMQ_USER:-zeal}
    RABBITMQ_SYSTEM_PASSCODE: ${RABBITMQ_PASSWORD:?}

services:
  realtime:
    <<: *service
    ports: ["${PRIVATE_IP:?}:8083:8083"]

# Lo lee el ANÁLISIS AUTOMÁTICO de SonarCloud (este repo no tiene paso de Sonar en el CI).
# Los scripts de pruebas y de herramientas (tests/, tools/) se tratan como código de prueba: usan Math.random
# para repartir carga, arman URLs de las VMs y llaman a comandos por PATH; no se despliegan ni corren en producción.
# Fuentes y pruebas deben ser conjuntos disjuntos: si una carpeta queda en los dos, el análisis falla
# ("can't be indexed twice") y el check del PR se queda esperando.
sonar.sources=.
sonar.exclusions=tests/**,tools/**
sonar.tests=tests,tools

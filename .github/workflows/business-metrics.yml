name: business-metrics

# R2-31: CI del consumidor de métricas de negocio (módulo nuevo; no toca a los productores).
on:
  push:
    branches: [main, develop]
    paths: ["services/zeal-business-metrics/**", ".github/workflows/business-metrics.yml"]
  pull_request:
    paths: ["services/zeal-business-metrics/**", ".github/workflows/business-metrics.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/zeal-business-metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Pruebas y empaquetado
        run: ./mvnw -B verify
      - name: Imagen Docker
        run: docker build -t zeal-business-metrics:ci .

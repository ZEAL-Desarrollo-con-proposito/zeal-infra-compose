spring.application.name=zeal-wellbeing
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/zeal_wellbeing_db}
spring.datasource.username=${DB_USERNAME:zeal_user}
spring.datasource.password=${DB_PASSWORD:zeal_password}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
server.port=${PORT:8080}
app.redis.enabled=${REDIS_ENABLED:true}
app.websocket.allowed-origin-patterns=${WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

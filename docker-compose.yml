# Infraestructura local de ZEAL. Los microservicios Spring Boot corren en el host (./mvnw spring-boot:run);
# aquí viven las bases de datos (una por bounded context), el broker de eventos y el API Gateway.
services:
  postgres-wellbeing:
    image: postgres:15-alpine
    container_name: zeal-postgres-wellbeing
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeal_wellbeing_db
      POSTGRES_USER: ${POSTGRES_USER:-zeal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeal_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_wellbeing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d zeal_wellbeing_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-marketplace:
    image: postgres:15-alpine
    container_name: zeal-postgres-marketplace
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeal_marketplace_db
      POSTGRES_USER: ${POSTGRES_USER:-zeal_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeal_password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_marketplace_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d zeal_marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-broker:
    image: redis:7-alpine
    container_name: zeal-redis-broker
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # SFU de las videollamadas grupales de los talleres. El navegador entra por el gateway (/livekit)
  # y envía el audio/video por UDP 50000-50100 (o TCP 7881 si la red bloquea UDP).
  livekit:
    image: livekit/livekit-server:v1.13.7
    container_name: zeal-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-zeal-dev}: ${LIVEKIT_API_SECRET:-ZealLiveKitDevSecretKeyMinimum32Chars!!}"
      NODE_IP: 127.0.0.1
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: false
        room:
          empty_timeout: 300
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  # API Gateway: punto de entrada único del frontend (VITE_API_BASE_URL=http://localhost:8080).
  api-gateway:
    image: nginx:1.27-alpine
    container_name: zeal-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - livekit
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_wellbeing_data:
  postgres_marketplace_data:
  redis_data:

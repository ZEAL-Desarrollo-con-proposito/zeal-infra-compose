# Despliegue completo de ZEAL en un solo servidor con Docker.
# Requiere los repositorios hermanos clonados junto a este (../zeal-wellbeing-service, etc.) y un .env
# creado a partir de .env.prod.example. Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Solo Caddy publica puertos (80/443); bases de datos, Redis y microservicios quedan en la red interna.
# Los límites de memoria permiten correr todo en una VM de 4 GB (la JVM usa el 75 % del límite como heap).
name: zeal-prod

x-service-env: &service-env
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET (mínimo 32 caracteres) en .env.prod}
  JWT_ISSUER: zeal
  APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Bogota}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Define PUBLIC_URL (p. ej. https://zeal.midominio.com) en .env.prod}
  DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}

services:
  postgres-wellbeing:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeal_wellbeing_db
      POSTGRES_USER: zeal_user
      POSTGRES_PASSWORD: ${WELLBEING_DB_PASSWORD:?Define WELLBEING_DB_PASSWORD en .env.prod}
    volumes:
      - wellbeing_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeal_user -d zeal_wellbeing_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-marketplace:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zeal_marketplace_db
      POSTGRES_USER: zeal_user
      POSTGRES_PASSWORD: ${MARKETPLACE_DB_PASSWORD:?Define MARKETPLACE_DB_PASSWORD en .env.prod}
    volumes:
      - marketplace_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zeal_user -d zeal_marketplace_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Broker STOMP del Real-Time Gateway (HU-DT-01, ADR-04). Solo en la red interna.
  rabbitmq:
    image: rabbitmq:4.2.9-management-alpine
    hostname: zeal-rabbitmq
    restart: unless-stopped
    mem_limit: 512m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zeal}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env.prod}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/20-zeal.conf:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_listener 61613"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  wellbeing:
    build: ../zeal-wellbeing-service
    image: zeal/wellbeing-service:latest
    mem_limit: 768m
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres-wellbeing:5432/zeal_wellbeing_db
      DB_USERNAME: zeal_user
      DB_PASSWORD: ${WELLBEING_DB_PASSWORD}
      ROOM_ICE_SERVERS: ${ROOM_ICE_SERVERS:-stun:stun.l.google.com:19302}
      TURN_URLS: ${TURN_URLS:?Define TURN_URLS (p. ej. turn:zeal.midominio.com:3478,turns:zeal.midominio.com:5349) en .env.prod}
      TURN_SECRET: ${TURN_SECRET}
      LIVEKIT_PUBLIC_URL: /livekit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-zeal}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # R2-17: login con Microsoft Entra ID (sin contraseñas). Ver docs/cowork/RUNBOOK (paso 9).
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:?Define OIDC_ISSUER_URI (https://login.microsoftonline.com/<tenant>/v2.0) en .env.prod}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Define OIDC_CLIENT_ID en .env.prod}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Define OIDC_CLIENT_SECRET en .env.prod}
      OIDC_REDIRECT_URI: ${PUBLIC_URL}/api/auth/microsoft/callback
      FRONTEND_URL: ${PUBLIC_URL}
    depends_on:
      postgres-wellbeing: { condition: service_healthy }
      redis: { condition: service_healthy }

  marketplace:
    build: ../zeal-marketplace-service
    image: zeal/marketplace-service:latest
    mem_limit: 768m
    restart: unless-stopped
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres-marketplace:5432/zeal_marketplace_db
      DB_USERNAME: zeal_user
      DB_PASSWORD: ${MARKETPLACE_DB_PASSWORD}
      LIVEKIT_PUBLIC_URL: /livekit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-zeal}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on:
      postgres-marketplace: { condition: service_healthy }
      redis: { condition: service_healthy }

  realtime:
    build: ../zeal-realtime-gateway
    image: zeal/realtime-gateway:latest
    mem_limit: 512m
    restart: unless-stopped
    environment:
      <<: *service-env
      WELLBEING_BASE_URL: http://wellbeing:8081
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_STOMP_PORT: "61613"
      RABBITMQ_CLIENT_LOGIN: ${RABBITMQ_USER:-zeal}
      RABBITMQ_CLIENT_PASSCODE: ${RABBITMQ_PASSWORD}
      RABBITMQ_SYSTEM_LOGIN: ${RABBITMQ_USER:-zeal}
      RABBITMQ_SYSTEM_PASSCODE: ${RABBITMQ_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      wellbeing: { condition: service_healthy }

  # SFU de las videollamadas grupales de los talleres (LiveKit). La señalización entra por el
  # gateway en /livekit; el audio/video usa UDP 50000-50100 o TCP 7881 directo a la VM.
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-zeal}: ${LIVEKIT_API_SECRET:?Define LIVEKIT_API_SECRET (mínimo 32 caracteres) en .env.prod}"
      # En Azure LiveKit descubre la IP pública de la VM por STUN. Solo para pruebas en un equipo local:
      # LIVEKIT_USE_EXTERNAL_IP=false y LIVEKIT_NODE_IP=127.0.0.1.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          turn_servers:
            - host: ${TURN_DOMAIN:?Define TURN_DOMAIN (dominio del certificado de coturn) en .env.prod}
              port: 3478
              protocol: udp
              secret: "${TURN_SECRET}"
              ttl: 7200
            - host: ${TURN_DOMAIN}
              port: ${TURN_TLS_PORT:-5349}
              protocol: tls
              secret: "${TURN_SECRET}"
              ttl: 7200
        room:
          empty_timeout: 300
          max_participants: 250
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  frontend:
    build: ../zeal-frontend-client
    image: zeal/frontend-client:latest
    restart: unless-stopped

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/crowdsec-bouncer.sh:/docker-entrypoint.d/40-crowdsec-bouncer.sh:ro
    environment:
      CROWDSEC_LAPI_URL: http://crowdsec:8080
      CROWDSEC_BOUNCER_KEY: ${CROWDSEC_BOUNCER_KEY:?Define CROWDSEC_BOUNCER_KEY (openssl rand -hex 24) en .env.prod}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/gateway/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      wellbeing: { condition: service_healthy }
      marketplace: { condition: service_healthy }
      realtime: { condition: service_healthy }
      frontend: { condition: service_healthy }
      livekit: { condition: service_started }

  # SEG-1 (ADR-15): CrowdSec lee los logs de NGINX, detecta fuerza bruta contra el login y decide el
  # bloqueo; el api-gateway lo aplica a /api/ con crowdsec-bouncer.sh. Sin red de CrowdSec (modo local).
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.0
    restart: unless-stopped
    environment:
      DISABLE_ONLINE_API: "true"
      BOUNCER_KEY_nginx: ${CROWDSEC_BOUNCER_KEY:?Define CROWDSEC_BOUNCER_KEY (openssl rand -hex 24)}
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/parsers/zeal-nginx-json.yaml:/etc/crowdsec/parsers/s01-parse/zeal-nginx-json.yaml:ro
      - ./crowdsec/scenarios/zeal-auth-bruteforce.yaml:/etc/crowdsec/scenarios/zeal-auth-bruteforce.yaml:ro
      - ./crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - crowdsec_data:/var/lib/crowdsec/data

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway: { condition: service_healthy }

  # HU-DT-02 (ADR-14): relé TURN permanente con credenciales temporales (use-auth-secret).
  # Abrir en el firewall: 3478/udp+tcp, TURN_TLS_PORT/tcp y 49160-49200/udp. En un solo servidor el
  # 443 lo usa Caddy, así que el TLS de TURN va en 5349; en el nodo de medios (multinodo) va en 443.
  # Certificados: TURN_CERT_DIR con turn.crt y turn.key (los del dominio; ver docs/cowork).
  coturn:
    image: coturn/coturn:4.7
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${TURN_CERT_DIR:-./coturn/certs}:/etc/coturn/certs:ro
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?Define TURN_SECRET en .env.prod}
      - --realm=zeal
      - --listening-port=3478
      - --tls-listening-port=${TURN_TLS_PORT:-5349}
      - --cert=/etc/coturn/certs/turn.crt
      - --pkey=/etc/coturn/certs/turn.key
      - --min-port=49160
      - --max-port=49200
      - --external-ip=${PUBLIC_IP:?Define PUBLIC_IP (IP pública de la VM) en .env.prod}
      - --no-cli
      - --no-multicast-peers
      # El relé no debe alcanzar la red interna (salvo LiveKit, que publica en la IP pública).
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 127.0.0.1 > /dev/null"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  wellbeing_db:
  marketplace_db:
  redis_data:
  rabbitmq_data:
  crowdsec_data:
  caddy_data:
  caddy_config:

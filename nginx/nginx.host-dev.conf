# Variante para depurar: los microservicios corren en el host (./mvnw spring-boot:run) y NGINX los
# alcanza por host.docker.internal. Una sola instancia de cada uno. Ver docker-compose.host-dev.yml.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/conf.d/zeal-common.conf;
    access_log /dev/stdout zeal_json;
    error_log /dev/stderr warn;

    upstream wellbeing   { server host.docker.internal:8081; keepalive 32; }
    upstream marketplace { server host.docker.internal:8082; keepalive 32; }
    upstream realtime    { server host.docker.internal:8083; keepalive 16; }
    upstream realtime_ws { server host.docker.internal:8083; }
    upstream livekit     { zone livekit 64k; server livekit:7880 resolve; }

    server {
        listen 8080;
        include /etc/nginx/conf.d/zeal-routes.conf;

        location / {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"El recurso solicitado no existe."}';
        }
    }
}

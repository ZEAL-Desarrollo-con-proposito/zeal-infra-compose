# API Gateway de ZEAL en producción: único punto de entrada detrás del proxy TLS (Caddy).
# Enruta por prefijo hacia cada bounded context y sirve la SPA desde el contenedor del frontend.
# Los nombres se resuelven con el DNS de Docker en cada petición: si un servicio se reinicia y
# cambia de IP, el gateway lo sigue encontrando.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8080;
        client_max_body_size 1m;

        set $wellbeing   http://wellbeing:8081;
        set $marketplace http://marketplace:8082;
        set $realtime    http://realtime:8083;
        set $frontend    http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        location = /gateway/health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        # Wellbeing Domain: autenticación, citas, salas y chat (contenido clínico).
        location /api/auth/      { proxy_pass $wellbeing; }
        location /api/wellbeing/ { proxy_pass $wellbeing; }
        location /api/chats/     { proxy_pass $wellbeing; }

        # Business Domain: convocatorias y talleres.
        location /api/proyectos      { proxy_pass $marketplace; }
        location /api/postulaciones/ { proxy_pass $marketplace; }
        location /api/talleres       { proxy_pass $marketplace; }
        location /api/inscripciones/ { proxy_pass $marketplace; }
        location /api/admin/         { proxy_pass $marketplace; }

        # Real-Time Gateway: notificaciones, presencia y STOMP/SockJS.
        location /api/notificaciones { proxy_pass $realtime; }
        location /api/presencia/     { proxy_pass $realtime; }
        location /ws {
            proxy_pass $realtime;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_buffering off;
        }

        location /api/ {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"El recurso solicitado no existe."}';
        }

        # Todo lo demás es la SPA.
        location / { proxy_pass $frontend; }
    }
}

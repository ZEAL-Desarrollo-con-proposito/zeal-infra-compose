# API Gateway de ZEAL en un solo servidor (docker-compose.prod.yml), detrás del proxy TLS (Caddy).
# Enruta por prefijo hacia cada bounded context y sirve la SPA desde el contenedor del frontend.
# Las réplicas se descubren por el DNS de Docker ("resolve"): escalar un servicio no requiere
# recargar NGINX. Las rutas y cabeceras son las mismas de nginx.conf (conf.d/).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    include /etc/nginx/conf.d/zeal-common.conf;
    access_log /dev/stdout zeal_json;
    error_log /dev/stderr warn;

    upstream wellbeing {
        zone wellbeing 64k;
        least_conn;
        server wellbeing:8081 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream marketplace {
        zone marketplace 64k;
        least_conn;
        server marketplace:8082 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream realtime {
        zone realtime 64k;
        least_conn;
        server realtime:8083 resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
    }
    upstream realtime_ws {
        zone realtime_ws 64k;
        hash $sockjs_session;   # DT-3; ver nginx.conf
        server realtime:8083 resolve max_fails=3 fail_timeout=10s;
    }
    upstream livekit {
        zone livekit 64k;
        server livekit:7880 resolve;
    }
    upstream frontend {
        zone frontend 64k;
        server frontend:80 resolve;
    }

    server {
        listen 8080;
        include /etc/nginx/conf.d/zeal-routes.conf;

        # Todo lo demás es la SPA.
        location / {
            include /etc/nginx/conf.d/zeal-proxy-headers.inc;
            proxy_pass http://frontend;
        }
    }
}

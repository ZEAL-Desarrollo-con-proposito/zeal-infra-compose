# Balanceador local de ZEAL (docker-compose.yml): dos réplicas por servicio, descubiertas por el
# DNS de Docker. "resolve" vuelve a consultar el nombre del servicio cada 5 s, así que una réplica
# nueva (docker compose up --scale realtime=3) recibe tráfico sin recargar NGINX (DISP-2).
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    include /etc/nginx/conf.d/zeal-common.conf;
    access_log /dev/stdout zeal_json;
    error_log /dev/stderr warn;

    # ADR-02: least_conn y una réplica que falla 3 veces sale 10 s de la rotación.
    upstream wellbeing {
        zone wellbeing 64k;
        least_conn;
        server wellbeing:8081 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream marketplace {
        zone marketplace 64k;
        least_conn;
        server marketplace:8082 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream realtime {
        zone realtime 64k;
        least_conn;
        server realtime:8083 resolve max_fails=3 fail_timeout=10s;
        keepalive 16;
    }
    # DT-3: afinidad por id de sesión SockJS. Sin "consistent" a propósito: con "resolve" todas las
    # réplicas comparten el nombre "realtime" y el hash consistente (que ubica sus puntos por nombre)
    # degenera en round robin. Probado en docs/evidencias/DT-4.md.
    upstream realtime_ws {
        zone realtime_ws 64k;
        hash $sockjs_session;
        server realtime:8083 resolve max_fails=3 fail_timeout=10s;
    }
    upstream livekit {
        zone livekit 64k;
        server livekit:7880 resolve;
    }

    server {
        listen 8080;
        include /etc/nginx/conf.d/zeal-routes.conf;

        location / {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"El recurso solicitado no existe."}';
        }
    }
}

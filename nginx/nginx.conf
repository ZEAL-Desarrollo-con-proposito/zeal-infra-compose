# API Gateway de ZEAL: enruta por prefijo hacia cada bounded context.
# Los servicios corren en el host; con Docker se alcanzan por host.docker.internal.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream wellbeing   { server host.docker.internal:8081; keepalive 32; }
    upstream marketplace { server host.docker.internal:8082; keepalive 32; }
    upstream realtime    { server host.docker.internal:8083; keepalive 32; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 8080;
        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;

        location = /gateway/health {
            default_type application/json;
            return 200 '{"status":"UP"}';
        }

        # Wellbeing Domain: autenticación, citas, salas y chat (contenido clínico).
        location /api/auth/      { proxy_pass http://wellbeing; }
        location /api/wellbeing/ { proxy_pass http://wellbeing; }
        location /api/chats/     { proxy_pass http://wellbeing; }

        # Business Domain: convocatorias y talleres.
        location /api/proyectos      { proxy_pass http://marketplace; }
        location /api/postulaciones/ { proxy_pass http://marketplace; }
        location /api/talleres       { proxy_pass http://marketplace; }
        location /api/inscripciones/ { proxy_pass http://marketplace; }
        location /api/admin/         { proxy_pass http://marketplace; }

        # Real-Time Gateway: notificaciones, presencia y STOMP/SockJS.
        location /api/notificaciones { proxy_pass http://realtime; }
        location /api/presencia/     { proxy_pass http://realtime; }
        location /ws {
            proxy_pass http://realtime;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            proxy_buffering off;
        }

        location / {
            default_type application/json;
            return 404 '{"status":404,"error":"Not Found","message":"El recurso solicitado no existe."}';
        }
    }
}

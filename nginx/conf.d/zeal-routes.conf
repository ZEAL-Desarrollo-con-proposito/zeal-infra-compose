# Rutas del API Gateway (todo /api, /ws y /livekit). Se incluye dentro de server {}. Requiere los upstreams wellbeing,
# marketplace, realtime, realtime_ws y livekit.

client_max_body_size 1m;

proxy_http_version 1.1;
include /etc/nginx/conf.d/zeal-proxy-headers.inc;
proxy_set_header Connection "";
add_header X-Request-Id $correlation_id always;
proxy_connect_timeout 2s;
proxy_read_timeout 30s;

# ADR-02: si una réplica falla o no responde, NGINX reintenta en la siguiente SOLO métodos
# idempotentes (GET, HEAD, PUT, DELETE...). Sin "non_idempotent", un POST nunca se repite: una
# reserva o postulación no puede quedar duplicada por un reintento.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 5s;

# SEG-1 · 429 en vez del 503 por defecto de limit_req (el frontend mostraría "servicio caído"), con
# Retry-After para que el cliente sepa cuánto esperar.
error_page 429 = @rate_limited;
location @rate_limited {
    default_type application/json;
    add_header Retry-After 60 always;
    add_header X-Request-Id $correlation_id always;
    return 429 '{"status":429,"error":"Too Many Requests","message":"Demasiados intentos desde esta red. Intenta de nuevo en un minuto."}';
}

# SEG-1 · IP bloqueada por CrowdSec: 403 con Retry-After, solo para /api/ (el SPA carga y puede mostrar el aviso).
error_page 403 = @banned;
location @banned {
    default_type application/json;
    add_header Retry-After 300 always;
    add_header X-Request-Id $correlation_id always;
    return 403 '{"status":403,"error":"Forbidden","message":"Acceso bloqueado desde esta red."}';
}
if ($crowdsec_deny_api) {
    return 403;
}

location = /gateway/health {
    access_log off;
    default_type application/json;
    return 200 '{"status":"UP"}';
}

# Wellbeing Domain: autenticación, citas, salas y chat (contenido clínico).
# SEG-1: los dos endpoints del login con Microsoft llevan límite por IP (zeal_auth, ver zeal-common.conf).
location = /api/auth/microsoft          { limit_req zone=zeal_auth burst=20 nodelay; limit_req_status 429; proxy_pass http://wellbeing; }
location = /api/auth/microsoft/callback { limit_req zone=zeal_auth burst=20 nodelay; limit_req_status 429; proxy_pass http://wellbeing; }
location /api/auth/         { proxy_pass http://wellbeing; }
location /api/wellbeing/    { proxy_pass http://wellbeing; }
location /api/chats/        { proxy_pass http://wellbeing; }
location /api/organizacion/ { proxy_pass http://wellbeing; }

# Business Domain: convocatorias y talleres.
location /api/proyectos      { proxy_pass http://marketplace; }
location /api/postulaciones/ { proxy_pass http://marketplace; }
location /api/talleres       { proxy_pass http://marketplace; }
location /api/inscripciones/ { proxy_pass http://marketplace; }
location /api/admin/         { proxy_pass http://marketplace; }

# Real-Time Gateway: notificaciones, presencia y STOMP/SockJS.
location /api/notificaciones { proxy_pass http://realtime; }
location /api/presencia/     { proxy_pass http://realtime; }
location = /api/telemetria   { client_max_body_size 16k; proxy_pass http://realtime; }   # R2-32
location /ws {
    proxy_pass http://realtime_ws;
    include /etc/nginx/conf.d/zeal-proxy-headers.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # El latido STOMP es de 10 s: 75 s sin tráfico ya es una conexión muerta. Los transportes de
    # respaldo (xhr-streaming) mantienen la petición abierta, así que tampoco se almacena.
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
    proxy_next_upstream off;   # Un socket o un stream a medias no se reintenta en otra réplica.
}

# SFU (señalización WebSocket de LiveKit); se quita el prefijo /livekit.
location /livekit/ {
    proxy_pass http://livekit/;
    include /etc/nginx/conf.d/zeal-proxy-headers.inc;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_buffering off;
    proxy_next_upstream off;
}

# Actuator nunca se expone por el borde (R2-30): Prometheus lo consulta por la red interna.
location /actuator { return 404; }

location /api/ {
    default_type application/json;
    return 404 '{"status":404,"error":"Not Found","message":"El recurso solicitado no existe."}';
}
# La location / (404 en local, SPA en producción) la define cada variante.

# Piezas comunes a todas las variantes del balanceador (local, un servidor y multinodo).
# Se incluye dentro del bloque http {}.

# SEG-1 · IP real del cliente. Detrás de Caddy (y del bridge de Docker) $remote_addr sería la del proxy:
# se confía en X-Forwarded-For solo si llega desde una red privada (Caddy, otro nodo de la VNet). Caddy
# descarta el X-Forwarded-For que traiga un cliente de Internet y pone el suyo, así que no se puede falsear.
# Toda la protección por IP (limit_req, CrowdSec) usa esta dirección.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# SEG-1 (HU-BE-20, ADR-15) · Límite de intentos de login por IP. Los dos endpoints del flujo con Microsoft
# (POST /api/auth/microsoft y GET /api/auth/microsoft/callback) comparten el contador: 60 por minuto
# sostenidos (1 por segundo) y ráfagas de hasta 20. Un inicio de sesión legítimo usa 2 peticiones, así que
# una IP puede iniciar ~30 sesiones por minuto (con margen para una empresa detrás del mismo NAT); un
# ataque de 100 intentos por minuto queda limitado casi de inmediato.
limit_req_zone $binary_remote_addr zone=zeal_auth:10m rate=60r/m;
limit_req_log_level warn;

# SEG-1 · Lista de IP bloqueadas por CrowdSec. La mantiene el sidecar crowdsec-bouncer.sh (una línea
# "<ip> 1;" por IP, regenerada cuando cambian las decisiones). Si no hay CrowdSec el directorio no existe y
# el mapa queda en 0 para todos. Solo se aplica a /api/ (ver zeal-routes.conf): el SPA siempre carga.
map $remote_addr $crowdsec_banned {
    default 0;
    include /etc/nginx/crowdsec/*.conf;
}
map "$crowdsec_banned:$uri" $crowdsec_deny_api {
    "~^1:/api/" 1;
    default     0;
}

# R2-29: el correlationId nace aquí. Se respeta el X-Request-Id entrante solo si tiene un formato
# seguro (evita inyectar texto arbitrario en los logs); si no, se genera uno nuevo.
map $http_x_request_id $correlation_id {
    "~^[A-Za-z0-9._-]{8,64}$" $http_x_request_id;
    default                   $request_id;
}

# Detrás de Caddy (TLS) el esquema real llega en X-Forwarded-Proto.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# DT-3: afinidad de los transportes de SockJS. Toda petición de una sesión SockJS lleva su id en
# la ruta (/ws/{servidor}/{sesión}/{transporte}); se reparte por hash de ese id. Ver la
# justificación frente a ip_hash y cookies en docs/evidencias/DT-4.md.
map $uri $sockjs_session {
    "~^/ws/[^/]+/(?<sid>[^/]+)/" $sid;
    default                      $request_id;   # /ws/info no tiene sesión: cualquier réplica sirve.
}

# remoteAddr (IP real) y location (adónde redirige el callback: /login?error=...) son lo que lee
# CrowdSec para detectar intentos de login fallidos; ver crowdsec/parsers/zeal-nginx-json.yaml.
log_format zeal_json escape=json '{"time":"$time_iso8601","correlationId":"$correlation_id","remoteAddr":"$remote_addr",'
    '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"location":"$sent_http_location",'
    '"requestTime":$request_time,"upstream":"$upstream_addr","upstreamTime":"$upstream_response_time",'
    '"userAgent":"$http_user_agent"}';
